server:
  port: 8090

spring:
  application:
    name: sky-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      routes:
        # AI客服拆出去的独立服务，这条更具体的规则必须排在下面的兜底规则前面——
        # Gateway按声明顺序匹配路由，先匹配上的生效
        - id: sky-ai-service
          uri: lb://sky-ai-service
          predicates:
            - Path=/user/ai/**
        - id: sky-invoice-service
          uri: lb://sky-invoice-service
          predicates:
            - Path=/user/invoice/**
        - id: sky-review-service-user
          uri: lb://sky-review-service
          predicates:
            - Path=/user/review/**
        - id: sky-review-service-admin
          uri: lb://sky-review-service
          predicates:
            - Path=/admin/review/**
        - id: sky-product-service-dish-user
          uri: lb://sky-product-service
          predicates:
            - Path=/user/dish/**
        - id: sky-product-service-dish-admin
          uri: lb://sky-product-service
          predicates:
            - Path=/admin/dish/**
        - id: sky-product-service-setmeal-user
          uri: lb://sky-product-service
          predicates:
            - Path=/user/setmeal/**
        - id: sky-product-service-setmeal-admin
          uri: lb://sky-product-service
          predicates:
            - Path=/admin/setmeal/**
        - id: sky-product-service-category-user
          uri: lb://sky-product-service
          predicates:
            - Path=/user/category/**
        - id: sky-product-service-category-admin
          uri: lb://sky-product-service
          predicates:
            - Path=/admin/category/**
        - id: sky-order-service-order-user
          uri: lb://sky-order-service
          predicates:
            - Path=/user/order/**
        - id: sky-order-service-order-admin
          uri: lb://sky-order-service
          predicates:
            - Path=/admin/order/**
        - id: sky-order-service-shop-user
          uri: lb://sky-order-service
          predicates:
            - Path=/user/shop/**
        - id: sky-order-service-shop-admin
          uri: lb://sky-order-service
          predicates:
            - Path=/admin/shop/**
        - id: sky-order-service-ws
          uri: lb://sky-order-service
          predicates:
            - Path=/ws/**
        - id: sky-order-service-notify
          uri: lb://sky-order-service
          predicates:
            - Path=/notify/**
        # 其余所有流量（/admin/**、/user/**其它路径）走单体sky-server：
        # 员工管理、用户资料、地址簿、购物车、报表统计等仍在sky-server
        - id: sky-server
          uri: lb://sky-server
          predicates:
            - Path=/**

logging:
  level:
    org.springframework.cloud.gateway: info
