server:
  port: 8096

spring:
  profiles:
    active: dev
  # PageHelperAutoConfiguration在这个Spring Boot版本下会触发循环引用（sky-server/sky-review-service/
  # sky-product-service都遇到过、也是这么解决的），不是这次拆分引入的新问题
  main:
    allow-circular-references: true
  application:
    name: sky-order-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${sky.datasource.username}
    password: ${sky.datasource.password}
    # 读写分离的从库连接，见com.sky.config.DataSourceConfiguration——只有标了@Slave的方法才会用到
    slave:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://${sky.datasource.slave-host}:${sky.datasource.slave-port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.slave-username}
      password: ${sky.datasource.slave-password}
  redis:
    password: ${sky.redis.password}
    database: ${sky.redis.database}
    sentinel:
      master: ${sky.redis.sentinel-master}
      nodes: ${sky.redis.sentinel-nodes}
  rabbitmq:
    host: ${sky.rabbitmq.host}
    port: ${sky.rabbitmq.port}
    username: ${sky.rabbitmq.username}
    password: ${sky.rabbitmq.password}
    virtual-host: ${sky.rabbitmq.virtual-host}

# Seata Saga：submit()下单场景"扣product-service库存+建本地订单"这一步真正的跨库分布式事务，
# 用状态机（resources/statelang/submit_order.json）编排代替手写补偿。只有order-service（发起
# 这个全局事务的一方）需要这一整块配置，product-service的/internal/stock/**接口不用做任何改造。
seata:
  application-id: sky-order-service
  tx-service-group: sky_order_service_tx_group
  registry:
    type: nacos
    nacos:
      server-addr: localhost:8848
      group: SEATA_GROUP
      # Seata Server启动时以这个服务名注册进Nacos，跟这里保持一致才能被发现
      application: seata-server
      cluster: default
  config:
    # 只用本地application.yml，不需要额外去Nacos配置中心拉一份配置——跟Seata Server那边
    # （deploy/seata-server/application.yml）同样的考虑，"client能通过Nacos服务发现找到TC"
    # 跟"client自己的配置来源"是两回事
    type: file
  service:
    vgroup-mapping:
      # 事务分组名->TC集群名，需要跟Seata Server自己的registry.conf里的cluster配置一致
      sky_order_service_tx_group: default
  saga:
    state-machine:
      # 用这个服务默认的Hikari数据源，状态机执行日志（seata_state_machine_*表）落在
      # sky_order_service库里，见database/migration_seata_saga_statelang_tables.sql
      table-prefix: seata_
      resources: classpath*:statelang/*.json

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  jwt:
    admin-secret-key: itcast
    admin-ttl: 36000000
    admin-token-name: token
    user-secret-key: itheima
    user-ttl: 7200000
    user-token-name: authentication
  # WeChatPayUtil是sky-common里的@Component，会被自动扫描进来——payment()现在直接跳过真实微信支付
  # 走本地mock（没有商户资质），这几个值实际不会被调用到，配上只是为了避免@ConfigurationProperties绑定空值的意外
  wechat:
    appid: ${sky.wechat.appid}
    secret: ${sky.wechat.secret}
    mchid: ${sky.wechat.mchid}
    mchSerialNo: ${sky.wechat.mchSerialNo}
    apiV3Key: ${sky.wechat.apiV3Key}
    privateKeyFilePath: ${sky.wechat.privateKeyFilePath}
    weChatPayCertFilePath: ${sky.wechat.weChatPayCertFilePath}
    notifyUrl: ${sky.wechat.notifyUrl}
    refundNotifyUrl: ${sky.wechat.refundNotifyUrl}
