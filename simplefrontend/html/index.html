<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Sky Take Out - API 测试台</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --panel2:#1c2438; --border:#2a3450;
    --text:#e6e9f0; --muted:#8b93a7; --accent:#4f8cff; --accent2:#3a6fd8;
    --get:#3fb950; --post:#4f8cff; --put:#d29922; --delete:#f85149;
    --ok:#3fb950; --err:#f85149;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Consolas,"Segoe UI",-apple-system,sans-serif;font-size:14px;}
  #app{display:flex;height:100vh;}

  /* sidebar */
  #sidebar{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
  #sidebar h1{font-size:15px;margin:0;padding:14px 14px 10px;border-bottom:1px solid var(--border);}
  #sidebar h1 span{color:var(--muted);font-weight:normal;font-size:12px;display:block;margin-top:2px;}
  #search{margin:10px 12px;padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text);width:calc(100% - 24px);}
  #search:focus{outline:none;border-color:var(--accent);}
  #nav{flex:1;overflow-y:auto;padding:0 6px 12px;}
  .group-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:12px 8px 4px;}
  .ctrl-title{font-size:12px;color:#aab4cc;padding:6px 8px 2px;font-weight:600;}
  .ep-btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:none;color:var(--text);padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;}
  .ep-btn:hover{background:var(--panel2);}
  .ep-btn.active{background:var(--accent);color:#fff;}
  .m-badge{flex:none;font-size:10px;font-weight:700;padding:2px 5px;border-radius:4px;color:#08101f;min-width:38px;text-align:center;}
  .m-GET{background:var(--get);} .m-POST{background:var(--accent);color:#fff;} .m-PUT{background:var(--put);} .m-DELETE{background:var(--delete);color:#fff;}
  .ep-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* main */
  #main{flex:1;display:flex;flex-direction:column;min-width:0;}
  #topbar{display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap;}
  #topbar .field{display:flex;align-items:center;gap:6px;}
  #topbar label{color:var(--muted);font-size:12px;}
  #topbar input{background:var(--panel2);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 8px;font-family:inherit;font-size:12px;width:230px;}
  #topbar input:focus{outline:none;border-color:var(--accent);}

  #content{flex:1;overflow-y:auto;padding:20px;}
  #empty{color:var(--muted);text-align:center;margin-top:80px;font-size:14px;}

  #detail{max-width:980px;}
  #ep-header{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap;}
  #ep-header .m-badge{font-size:12px;padding:4px 8px;}
  #ep-path{font-family:Consolas,monospace;font-size:15px;color:#dfe6f5;}
  #ep-name{font-size:18px;font-weight:600;margin:2px 0 10px;}
  .auth-badge{font-size:11px;padding:2px 7px;border-radius:10px;border:1px solid var(--border);color:var(--muted);}
  .auth-admin{border-color:#d29922;color:#d29922;}
  .auth-user{border-color:#4f8cff;color:#4f8cff;}
  .auth-none{border-color:#3fb950;color:#3fb950;}

  #note{background:#2a2313;border:1px solid #5c4a12;color:#e6c760;padding:8px 12px;border-radius:6px;font-size:12.5px;margin-bottom:14px;line-height:1.5;}

  #pathParams{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  #pathParams .pp{display:flex;flex-direction:column;gap:4px;}
  #pathParams label{font-size:11px;color:var(--muted);}
  #pathParams input{background:var(--panel2);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:6px 9px;font-family:Consolas,monospace;width:140px;}

  .panel-label{font-size:12px;color:var(--muted);margin:14px 0 6px;display:flex;justify-content:space-between;align-items:center;}
  textarea{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:12px;font-family:Consolas,"Courier New",monospace;font-size:13px;resize:vertical;line-height:1.5;}
  #reqBody{height:220px;}
  #resBody{height:280px;color:#c9d6f0;}
  #reqBody:focus,#resBody:focus{outline:none;border-color:var(--accent);}

  #fileRow{margin:10px 0;}
  #fileRow input[type=file]{color:var(--text);}

  #sendBtn{margin-top:14px;background:var(--accent);color:#fff;border:none;padding:10px 26px;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;}
  #sendBtn:hover{background:var(--accent2);}
  #sendBtn:disabled{opacity:.5;cursor:default;}
  #status{margin-left:14px;font-size:13px;font-weight:600;}
  .status-ok{color:var(--ok);} .status-err{color:var(--err);}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#2f3a58;border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>

<div id="app">

    <h1>Sky Take Out<span>后端接口测试台 · <span id="epCount">0</span> 个接口</span></h1>
    <input id="search" placeholder="搜索接口名 / 路径...">
    <div id="nav"></div>
  </div>

  <div id="main">
    <div id="topbar">
      <div class="field">
        <label>管理端 token</label>
        <input id="adminToken" placeholder="登录后自动填入，或手动粘贴">
      </div>
      <div class="field">
        <label>用户端 token</label>
        <input id="userToken" placeholder="登录后自动填入，或手动粘贴">
      </div>
    </div>

    <div id="content">
      <div id="empty">从左侧选择一个接口开始测试</div>
      <div id="detail" style="display:none;">
        <div id="ep-header">
          <span id="ep-method" class="m-badge"></span>
          <span id="ep-path"></span>
          <span id="ep-auth" class="auth-badge"></span>
        </div>
        <div id="ep-name"></div>
        <div id="note" style="display:none;"></div>

        <div id="pathParams"></div>

        <div id="fileRow" style="display:none;">
          <label style="color:var(--muted);font-size:12px;">选择要上传的文件：</label><br>
          <input type="file" id="fileInput">
        </div>

        <div id="bodyPanel">
          <div class="panel-label">
            <span id="bodyLabel">请求参数（JSON）</span>
          </div>
          <textarea id="reqBody" spellcheck="false"></textarea>
        </div>

        <button id="sendBtn">发送 ▶</button>
        <span id="status"></span>

        <div class="panel-label" style="margin-top:20px;">返回值</div>
        <textarea id="resBody" readonly spellcheck="false" placeholder="点击「发送」查看返回结果..."></textarea>
      </div>
    </div>
  </div>
</div>

const GROUP_LABEL = { admin: "管理端 /admin", user: "用户端 /user", notify: "回调 /notify" };

let current = null;

const navEl = document.getElementById('nav');
const searchEl = document.getElementById('search');
const epCountEl = document.getElementById('epCount');
epCountEl.textContent = API_SPEC.length;

function renderNav(filterText){
  navEl.innerHTML = '';
  const f = (filterText||'').trim().toLowerCase();
  const groups = {};
  API_SPEC.forEach((ep, idx) => {
    if (f && !(ep.name.toLowerCase().includes(f) || ep.path.toLowerCase().includes(f) || ep.controllerLabel.toLowerCase().includes(f))) return;
    groups[ep.group] = groups[ep.group] || {};
    groups[ep.group][ep.controllerLabel] = groups[ep.group][ep.controllerLabel] || [];
    groups[ep.group][ep.controllerLabel].push(idx);
  });
  ['admin','user','notify'].forEach(g => {
    if (!groups[g]) return;
    const gt = document.createElement('div');
    gt.className = 'group-title';
    gt.textContent = GROUP_LABEL[g] || g;
    navEl.appendChild(gt);
    Object.keys(groups[g]).forEach(ctrl => {
      const ct = document.createElement('div');
      ct.className = 'ctrl-title';
      ct.textContent = ctrl;
      navEl.appendChild(ct);
      groups[g][ctrl].forEach(idx => {
        const ep = API_SPEC[idx];
        const btn = document.createElement('button');
        btn.className = 'ep-btn';
        btn.dataset.idx = idx;
        btn.innerHTML = `<span class="m-badge m-${ep.method}">${ep.method}</span><span class="ep-name">${ep.name}</span>`;
        btn.onclick = () => selectEndpoint(idx);
        navEl.appendChild(btn);
      });
    });
  });
}

searchEl.addEventListener('input', () => renderNav(searchEl.value));

function authBadge(auth){
  if (auth === 'admin') return '<span class="auth-badge auth-admin">需要管理端 token</span>';
  if (auth === 'user') return '<span class="auth-badge auth-user">需要用户端 token</span>';
  return '<span class="auth-badge auth-none">无需登录</span>';
}

function selectEndpoint(idx){
  current = API_SPEC[idx];
  document.querySelectorAll('.ep-btn').forEach(b => b.classList.toggle('active', +b.dataset.idx === idx));

  document.getElementById('empty').style.display = 'none';
  document.getElementById('detail').style.display = 'block';

  document.getElementById('ep-method').textContent = current.method;
  document.getElementById('ep-method').className = 'm-badge m-' + current.method;
  document.getElementById('ep-path').textContent = current.path;
  document.getElementById('ep-name').textContent = current.name;
  document.getElementById('ep-auth').outerHTML = authBadge(current.auth).replace('<span class="auth-badge', '<span id="ep-auth" class="auth-badge');

  const noteEl = document.getElementById('note');
  if (current.note) { noteEl.style.display = 'block'; noteEl.textContent = '⚠ ' + current.note; }
  else { noteEl.style.display = 'none'; }

  // path params
  const ppEl = document.getElementById('pathParams');
  ppEl.innerHTML = '';
  (current.pathParams || []).forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'pp';
    const guess = (current.bodyTemplate && current.bodyTemplate[p] !== undefined) ? current.bodyTemplate[p] : (p === 'id' ? 1 : (p === 'status' ? 1 : ''));
    wrap.innerHTML = `<label>路径参数 {${p}}</label><input data-pp="${p}" value="${guess}">`;
    ppEl.appendChild(wrap);
  });

  // file vs json body
  const fileRow = document.getElementById('fileRow');
  const bodyPanel = document.getElementById('bodyPanel');
  const bodyLabel = document.getElementById('bodyLabel');
  if (current.paramMode === 'multipart') {
    fileRow.style.display = 'block';
    bodyPanel.style.display = 'none';
  } else {
    fileRow.style.display = 'none';
    bodyPanel.style.display = 'block';
    bodyLabel.textContent = current.paramMode === 'queryParams'
      ? '请求参数（JSON，发送时会转换为查询字符串）'
      : (current.paramMode === 'requestBody' ? '请求体（JSON）' : '（该接口无需请求参数）');
    document.getElementById('reqBody').value = current.bodyTemplate ? JSON.stringify(current.bodyTemplate, null, 2) : '';
    document.getElementById('reqBody').readOnly = (current.paramMode === 'none' || current.paramMode === 'pathOnly');
  }

  document.getElementById('resBody').value = '';
  document.getElementById('status').textContent = '';
}

function buildPath(){
  let path = current.path;
  document.querySelectorAll('#pathParams input').forEach(inp => {
    path = path.replace('{' + inp.dataset.pp + '}', encodeURIComponent(inp.value));
  });
  return path;
}

function toQueryString(obj){
  const parts = [];
  Object.keys(obj || {}).forEach(k => {
    const v = obj[k];
    if (v === null || v === undefined || v === '') return;
    if (Array.isArray(v)) {
      v.forEach(item => parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(item)));
    } else if (typeof v === 'object') {
      // flatten one level for nested query DTOs (rare in this API)
      parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(JSON.stringify(v)));
    } else {
      parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
    }
  });
  return parts.join('&');
}

document.getElementById('sendBtn').addEventListener('click', async () => {
  if (!current) return;
  const statusEl = document.getElementById('status');
  const resEl = document.getElementById('resBody');
  const sendBtn = document.getElementById('sendBtn');
  statusEl.textContent = '发送中...';
  statusEl.className = '';
  resEl.value = '';
  sendBtn.disabled = true;

  try {
    let url = buildPath();
    const headers = {};
    if (current.auth === 'admin') {
      const t = document.getElementById('adminToken').value.trim();
      if (t) headers['token'] = t;
    } else if (current.auth === 'user') {
      const t = document.getElementById('userToken').value.trim();
      if (t) headers['authentication'] = t;
    }

    const fetchOpts = { method: current.method, headers };

    if (current.paramMode === 'multipart') {
      const fileInput = document.getElementById('fileInput');
      if (!fileInput.files.length) throw new Error('请先选择要上传的文件');
      const fd = new FormData();
      fd.append('file', fileInput.files[0]);
      fetchOpts.body = fd; // browser sets multipart boundary automatically
    } else if (current.paramMode === 'requestBody') {
      const raw = document.getElementById('reqBody').value.trim();
      headers['Content-Type'] = 'application/json';
      fetchOpts.body = raw ? raw : '{}';
      // validate JSON early for a clearer error than a failed request
      JSON.parse(fetchOpts.body);
    } else if (current.paramMode === 'queryParams') {
      const raw = document.getElementById('reqBody').value.trim();
      const obj = raw ? JSON.parse(raw) : {};
      const qs = toQueryString(obj);
      if (qs) url += (url.includes('?') ? '&' : '?') + qs;
    }
    // pathOnly / none: nothing extra to add

    const t0 = performance.now();
    const resp = await fetch(url, fetchOpts);
    const ms = Math.round(performance.now() - t0);

    statusEl.textContent = `${resp.status} ${resp.statusText} · ${ms}ms`;
    statusEl.className = resp.ok ? 'status-ok' : 'status-err';

    if (current.bodyType === 'binary-response') {
      const blob = await resp.blob();
      if (resp.ok) {
        const dlUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = dlUrl;
        a.download = 'export.xlsx';
        document.body.appendChild(a);
        a.click();
        a.remove();
        resEl.value = `(二进制文件流，已触发浏览器下载：${blob.size} 字节)`;
      } else {
        resEl.value = await blob.text();
      }
    } else {
      const text = await resp.text();
      try {
        resEl.value = JSON.stringify(JSON.parse(text), null, 2);
      } catch (e) {
        resEl.value = text;
      }
      // auto-capture token after a successful login call
      if (resp.ok && /\/login$/.test(current.path)) {
        try {
          const data = JSON.parse(text);
          const token = data && data.data && data.data.token;
          if (token) {
            if (current.group === 'admin') {
              document.getElementById('adminToken').value = token;
              localStorage.setItem('sky_admin_token', token);
            } else if (current.group === 'user') {
              document.getElementById('userToken').value = token;
              localStorage.setItem('sky_user_token', token);
            }
          }
        } catch (e) {}
      }
    }
  } catch (err) {
    statusEl.textContent = '请求失败';
    statusEl.className = 'status-err';
    resEl.value = '错误：' + err.message + '\n\n（若是网络错误，请确认后端已在 8080 端口启动，且是通过本 nginx 页面访问，而不是直接打开 html 文件）';
  } finally {
    sendBtn.disabled = false;
  }
});

// restore saved tokens
const savedAdmin = localStorage.getItem('sky_admin_token');
const savedUser = localStorage.getItem('sky_user_token');
if (savedAdmin) document.getElementById('adminToken').value = savedAdmin;
if (savedUser) document.getElementById('userToken').value = savedUser;
document.getElementById('adminToken').addEventListener('change', e => localStorage.setItem('sky_admin_token', e.target.value));
document.getElementById('userToken').addEventListener('change', e => localStorage.setItem('sky_user_token', e.target.value));

renderNav('');
</script>
</body>
</html>
